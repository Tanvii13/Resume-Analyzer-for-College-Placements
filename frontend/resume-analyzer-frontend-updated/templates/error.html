{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block content %}
<section class="auth-wrap">
  <div class="auth-card glass glass-thick center">
    <span class="eyebrow eyebrow-error">Error {{ code }}</span>
    <h1 class="display-title">{{ title }}</h1>
    <p class="muted">{{ message }}</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary btn-block">Go Home</a>
  </div>
</section>
{% endblock %}
