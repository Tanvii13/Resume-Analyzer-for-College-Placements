<header class="app-nav">
  <div class="container nav-inner">

    <nav class="nav-links" id="nav-links">

      <a href="{{ url_for('dashboard') }}#resumes">My Resumes</a>
      <a href="{{ url_for('dashboard') }}#upload">Upload New</a>
