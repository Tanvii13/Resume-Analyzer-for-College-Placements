{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block content %}
<section class="auth-wrap">
  <div class="card auth-card center">
    <span class="eyebrow eyebrow-error">Error {{ code }}</span>
    <h2>{{ title }}</h2>
    <p class="muted">{{ message }}</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary btn-block">Go home</a>
  </div>
</section>
{% endblock %}
