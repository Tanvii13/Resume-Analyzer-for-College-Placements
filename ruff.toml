# Ruff configuration for Resume Analyzer
target-version = "py311"
line-length = 100

exclude = [
    ".git",
    ".pytest_cache",
    ".venv",
    "venv",
    "__pycache__",
    "node_modules",
    "storage",
    "uploads",
]

[lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
]

ignore = [
    "E402",  # Module level import not at top (needed for setting sys.path and env vars in tests)
    "E501",  # Line length (handled flexibly)
    "E741",  # Ambiguous variable name (e.g. `l` for line or link)
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["F401"]
"*/tests/*" = ["F401"]
